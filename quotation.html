<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Techwave Enterprises – Quotation Generator</title>
  <style>
    :root {
      --navy: #0b2a6b;
      --blue: #1e56d8;
      --orange: #f26a1b;
      --bg: #eef2f8;
      --card: #fff;
      --line: #d5dcea;
      --text: #17233f;
      --muted: #5b6785;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px
    }

    /* ---------- App shell ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--navy);
      color: #fff;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      flex-wrap: wrap
    }

    .topbar h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 700;
      letter-spacing: .3px
    }

    .topbar h1 span {
      color: #ffb27f
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    button,
    .btn {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 600
    }

    .btn-primary {
      background: var(--orange);
      color: #fff
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .14);
      color: #fff
    }

    .btn-small {
      padding: 6px 10px;
      font-size: 12.5px;
      background: #e8eefc;
      color: var(--navy)
    }

    .btn-danger {
      background: #fde8e6;
      color: #b42318
    }

    .tabs {
      display: none;
      background: #fff;
      border-bottom: 1px solid var(--line)
    }

    .tabs button {
      flex: 1;
      background: none;
      border-radius: 0;
      padding: 12px;
      color: var(--muted);
      border-bottom: 3px solid transparent
    }

    .tabs button.on {
      color: var(--navy);
      border-bottom-color: var(--orange)
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(340px, 440px) 1fr;
      gap: 16px;
      padding: 16px;
      max-width: 1500px;
      margin: 0 auto;
      align-items: start
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--navy)
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .full {
      grid-column: 1/-1
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 3px;
      font-weight: 600
    }

    input,
    select,
    textarea {
      width: 100%;
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text)
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid #9db8f5;
      border-color: #6f93ee
    }

    textarea {
      resize: vertical;
      min-height: 58px
    }

    details.card summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--navy);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .6px
    }

    details.card[open] summary {
      margin-bottom: 10px
    }

    .check {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 8px 0
    }

    .check input {
      width: auto
    }

    .check label {
      margin: 0;
      font-size: 13px;
      color: var(--text)
    }

    .item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      background: #fafcff
    }

    .item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 700;
      color: var(--navy)
    }

    .item .grid3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .preview-wrap {
      overflow: auto;
      padding-bottom: 30px
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 8px
    }

    @media (max-width:980px) {
      .layout {
        grid-template-columns: 1fr;
        padding: 10px
      }

      .tabs {
        display: flex
      }

      body.tab-edit .preview-wrap {
        display: none
      }

      body.tab-preview .panel {
        display: none
      }
    }

    /* ---------- Invoice sheet ---------- */
    .sheet {
      background: #fff;
      width: 210mm;
      margin: 0 auto;
      padding: 8mm;
      box-shadow: 0 4px 24px rgba(15, 35, 80, .18);
      color: #111;
      font-size: 9pt;
      line-height: 1.35;
      transform-origin: top left
    }

    .sheet.landscape {
      width: 297mm
    }

    .inv-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 6px;
      border-bottom: 2.5px solid var(--navy);
      position: relative
    }

    .inv-head::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -5px;
      width: 38%;
      height: 2px;
      background: var(--orange)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .brand svg {
      width: 82px;
      height: 48px;
      flex: none
    }

    .brand .name {
      font-weight: 900;
      font-size: 21pt;
      letter-spacing: .5px;
      line-height: 1;
      color: var(--navy)
    }

    .brand .name b {
      color: var(--blue)
    }

    .brand .sub {
      font-weight: 700;
      letter-spacing: 5px;
      font-size: 8.5pt;
      color: var(--navy);
      margin-top: 2px
    }

    .brand .tag {
      font-size: 6.5pt;
      letter-spacing: 2px;
      color: var(--orange);
      font-weight: 700;
      margin-top: 2px
    }

    .contact {
      text-align: right;
      font-size: 8.5pt;
      line-height: 1.45
    }

    .contact .addr {
      max-width: 95mm;
      margin-left: auto;
      white-space: pre-line
    }

    .contact b {
      color: var(--navy)
    }

    .inv-title {
      text-align: center;
      font-weight: 800;
      font-size: 12.5pt;
      letter-spacing: 1px;
      color: var(--navy);
      margin: 9px 0 5px;
      text-transform: uppercase
    }

    .inv-title .hl {
      display: inline-block;
      background: var(--orange);
      color: #fff;
      padding: 2px 26px;
      border-radius: 3px;
      letter-spacing: 3px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #333;
      border-bottom: 0
    }

    .meta>div {
      padding: 3px 6px;
      border-bottom: 1px solid #333
    }

    .meta>div:nth-child(odd) {
      border-right: 1px solid #333
    }

    .meta b {
      font-weight: 700
    }

    .parties {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #333;
      border-bottom: 0
    }

    .parties>div {
      padding: 4px 6px;
      border-bottom: 1px solid #333;
      min-height: 30mm
    }

    .parties>div:first-child {
      border-right: 1px solid #333
    }

    .parties h4 {
      margin: 0 0 3px;
      font-size: 9pt;
      color: var(--navy)
    }

    .parties .line {
      white-space: pre-line
    }

    table.items {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
      border: 1px solid #333;
      font-size: 7.5pt
    }

    table.items th,
    table.items td {
      border: 1px solid #333;
      padding: 3px 2px;
      vertical-align: top;
      white-space: nowrap;
      font-size: 1em
    }

    table.items td.desc {
      white-space: pre-line;
      overflow-wrap: anywhere;
      min-width: 28mm;
      width: 100%
    }

    table.items thead th {
      white-space: nowrap;
      font-size: .93em;
      padding: 3px 3px
    }

    table.items thead th.wrap {
      white-space: normal
    }



    table.items thead th {
      background: #eaf0fd;
      color: var(--navy);
      text-align: center;
      font-weight: 700;
      vertical-align: middle
    }

    table.items thead {
      display: table-header-group
    }

    table.items tbody tr {
      break-inside: avoid;
      page-break-inside: avoid
    }

    table.items td.n {
      text-align: right;
      white-space: nowrap
    }

    table.items td.c {
      text-align: center
    }

    table.items tr.fill td {
      border-top: 0;
      border-bottom: 0
    }

    table.items tbody tr:not(.fill) td {
      border-top: 0;
      border-bottom: 0
    }

    table.items tbody tr:last-child td {
      border-bottom: 0
    }

    .bottom {
      break-inside: avoid;
      page-break-inside: avoid;
      border: 1px solid #333;
      border-top: 0
    }

    .bottom .row {
      display: grid;
      grid-template-columns: 1.25fr 1fr
    }

    .bottom .left {
      padding: 5px 6px;
      border-right: 1px solid #333
    }

    .bottom .sum div {
      display: flex;
      justify-content: space-between;
      padding: 3px 6px;
      border-bottom: 1px solid #333
    }

    .bottom .sum div:last-child {
      border-bottom: 0;
      font-weight: 800;
      background: #eaf0fd;
      color: var(--navy);
      font-size: 10pt
    }

    .words {
      font-weight: 700
    }

    .terms {
      margin-top: 6px;
      font-size: 8pt;
      white-space: pre-line
    }

    .bank {
      margin-top: 6px;
      font-size: 8pt;
      white-space: pre-line
    }

    .sign {
      border-top: 1px solid #333;
      display: grid;
      grid-template-columns: 1fr 1fr;
      break-inside: avoid
    }

    .sign>div {
      padding: 6px;
      min-height: 24mm
    }

    .sign .r {
      text-align: right;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      justify-content: space-between
    }

    .sign b {
      color: var(--navy)
    }

    .foot {
      margin-top: 6px;
      text-align: center;
      font-style: italic;
      font-size: 8pt;
      color: var(--navy);
      background: #eaf0fd;
      padding: 4px;
      border-radius: 2px
    }

    /* ---------- Print ---------- */
    @media print {

      html,
      body {
        background: #fff
      }

      .topbar,
      .tabs,
      .panel {
        display: none !important
      }

      .layout {
        display: block;
        padding: 0;
        margin: 0;
        max-width: none
      }

      .preview-wrap {
        display: block !important;
        overflow: visible;
        padding: 0
      }

      .sheet {
        box-shadow: none;
        margin: 0;
        padding: 0;
        width: auto !important;
        zoom: 1 !important
      }

      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact
      }
    }
  </style>
  <style id="pageRule">
    @page {
      size: A4 portrait;
      margin: 8mm
    }
  </style>
</head>

<body class="tab-edit">

  <div class="topbar">
    <h1>TECH<span>WAVE</span> · Quotation Generator</h1>
    <div class="actions">
      <button class="btn-ghost" id="btnReset">New quotation</button>
      <button class="btn-primary" id="btnPrint">🖨 Print / Save as PDF</button>
    </div>
  </div>
  <div class="tabs">
    <button id="tabEdit" class="on">Edit</button>
    <button id="tabPrev">Preview</button>
  </div>

  <div class="layout">
    <!-- ================= FORM ================= -->
    <div class="panel">

      <details class="card">
        <summary>Your company (saved on this device)</summary>
        <div class="grid2">
          <div class="full"><label>Address (appears on the invoice)</label><textarea data-k="coAddress"
              placeholder="Shop / Office address, City, PIN"></textarea></div>
          <div><label>Mobile no.</label><input data-k="coPhone"></div>
          <div><label>Email</label><input data-k="coEmail"></div>
          <div><label>Your GSTIN</label><input data-k="coGstin" placeholder="27XXXXXXXXXXXZX"></div>
          <div><label>State / Code</label>
            <div class="grid2"><input data-k="coState" placeholder="Maharashtra"><input data-k="coStateCode"
                placeholder="27"></div>
          </div>
          <div class="full"><label>Bank details (optional)</label><textarea data-k="bank"
              placeholder="Bank name, A/c no., IFSC"></textarea></div>
        </div>
      </details>

      <div class="card">
        <h2>Quotation details</h2>
        <div class="grid2">
          <div><label>Serial Number Invoice</label><input data-k="invNo" placeholder="001/2026-27"></div>
          <div><label>Mode of Transport</label><input data-k="transport" placeholder="Courier / Road"></div>
          <div><label>P.O. No.</label><input data-k="poNo"></div>
          <div><label>P.O. Date</label><input type="date" data-k="poDate"></div>
          <div><label>Date of Supply</label><input type="date" data-k="supplyDate"></div>
          <div><label>Time of Supply</label><input type="time" data-k="supplyTime"></div>
          <div><label>Vehicle No.</label><input data-k="vehicle"></div>
          <div><label>Place of Supply</label><input data-k="placeOfSupply"></div>
        </div>
      </div>

      <div class="card">
        <h2>Receiver (Billed To)</h2>
        <div class="grid2">
          <div class="full"><label>Name</label><input data-k="bName"></div>
          <div class="full"><label>Address</label><textarea data-k="bAddress"></textarea></div>
          <div><label>State</label><input data-k="bState"></div>
          <div><label>State Code</label><input data-k="bStateCode" inputmode="numeric"></div>
          <div class="full"><label>GSTIN / Unique ID </label><input data-k="bGstin"
              style="background:#f1f4fa;font-weight:600"></div>
        </div>
      </div>

      <div class="card">
        <h2>Consignee (Shipped To)</h2>
        <div class="check"><input type="checkbox" id="same" data-k="same"><label for="same">Same as Receiver</label>
        </div>
        <div class="grid2" id="consigneeFields">
          <div class="full"><label>Name</label><input data-k="cName"></div>
          <div class="full"><label>Address</label><textarea data-k="cAddress"></textarea></div>
          <div><label>State</label><input data-k="cState"></div>
          <div><label>State Code</label><input data-k="cStateCode" inputmode="numeric"></div>
          <div class="full"><label>GSTIN / Unique ID</label><input data-k="cGstin"></div>
        </div>
      </div>

      <div class="card">
        <h2>Items</h2>
        <div id="itemsBox"></div>
        <button class="btn-small" id="addItem">+ Add item</button>
      </div>

      <div class="card">
        <h2>Tax &amp; totals</h2>
        <div class="grid2">
          <div class="full"><label>GST type</label>
            <select data-k="taxMode">
              <option value="auto">Auto (same state → CGST+SGST, else IGST)</option>
              <option value="intra">CGST + SGST (within state)</option>
              <option value="inter">IGST (other state)</option>
            </select>
          </div>
          <div><label>Freight charges (₹)</label><input type="number" min="0" step="0.01" data-k="freight"></div>
          <div><label>Round off</label>
            <select data-k="roundMode">
              <option value="auto">Round to nearest ₹1</option>
              <option value="none">No rounding</option>
            </select>
          </div>
          <div class="full"><label>Terms &amp; conditions</label><textarea data-k="terms" rows="3"></textarea></div>
          <div class="full"><label>Page orientation</label>
            <select data-k="orientation">
              <option value="portrait">A4 Portrait</option>
              <option value="landscape">A4 Landscape (more room for columns)</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= PREVIEW ================= -->
    <div class="preview-wrap" id="previewWrap">
      <div class="sheet" id="sheet"></div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";
      var KEY = "techwave_quotation_v1";
      /* Receiver (Billed To) GSTIN is fixed. To change it, edit the value below. */
      var RECEIVER_GSTIN = "27AAFPY8345R1ZJ";
      var $ = function (s, r) { return (r || document).querySelector(s) };
      var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)) };

      function pad(n) { return String(n).padStart(2, "0") }
      function today() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) }

      var COMPANY_KEYS = ["coAddress", "coPhone", "coEmail", "coGstin", "coState", "coStateCode", "bank"];

      function blankItem() { return { desc: "", hsn: "", qty: 1, unit: "Nos.", rate: 0, disc: 0, gst: 18 } }
      function defaults() {
        return {
          coAddress: "Fourth Floor Ten No.1, LIG 20, Navi Mumbai, - 400706", coPhone: "9975589895, 9823158790", coEmail: "techwave8790@gmail.com", coGstin: "27AAFPY8345R1ZJ", coState: "Maharashtra", coStateCode: "27", bank: "A/c No.: 4168976430",
          invNo: "", transport: "", poNo: "", poDate: "", supplyDate: today(), supplyTime: "17:00", vehicle: "", placeOfSupply: "",
          bName: "", bAddress: "", bState: "Maharashtra", bStateCode: "27", bGstin: RECEIVER_GSTIN,
          same: true, cName: "", cAddress: "", cState: "", cStateCode: "", cGstin: "27AAFPY8345R1ZJ",
          docType: "quotation", taxMode: "auto", freight: 0, roundMode: "auto", orientation: "portrait",
          terms: "Terms & Conditions:\n1. Prices are in Indian Rupees and GST is shown separately above.\n2. Delivery: Within 5–7 working days from confirmed purchase order, subject to stock availability.\n3. Payment: 100% within 15 days from delivery / invoice date.\n4. Warranty: As per respective manufacturer's standard warranty, where applicable.\n\nWe trust you will find our offer most competitive and request you favor us with your valued purchase / work order.\nWe are always at your service and thanking you in the meanwhile, we remain.\n\nThanking you,",
          items: [blankItem()]
        };
      }

      var S = defaults();
      try {
        var saved = JSON.parse(localStorage.getItem(KEY) || "null");
        if (saved && typeof saved === "object") { S = Object.assign(defaults(), saved); if (!S.items || !S.items.length) S.items = [blankItem()] }
      } catch (e) { }
      S.bGstin = RECEIVER_GSTIN;
      S.docType = "quotation";
      /* fill the new defaults into company details saved by an earlier version */
      var D0 = defaults();
      if (!S.coAddress) S.coAddress = D0.coAddress;
      if (!S.coPhone || S.coPhone === "8356058098") S.coPhone = D0.coPhone;
      if (!S.bank) S.bank = D0.bank;
      if (S.terms === "1. Interest @24% will be charged on invoices not paid on due date.\n2. All disputes subject to Pune jurisdiction only.") S.terms = D0.terms;
      function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) { } }

      /* ---------- helpers ---------- */
      function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c] }) }
      function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0 }
      function r2(n) { return Math.round((n + Number.EPSILON) * 100) / 100 }
      function money(n) { return n.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }
      function dmy(iso) { if (!iso) return ""; var p = iso.split("-"); return p.length === 3 ? p[2] + "." + p[1] + "." + p[0] : iso }
      function t12(t) { if (!t) return ""; var p = t.split(":"), h = +p[0], m = p[1], ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return pad(h) + ":" + m + " " + ap }

      var ONES = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
      var TENS = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
      function below100(n) { return n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? " " + ONES[n % 10] : "") }
      function below1000(n) { var s = ""; if (n >= 100) { s = ONES[Math.floor(n / 100)] + " Hundred"; n %= 100; if (n) s += " " } return s + (n ? below100(n) : "") }
      function wordsInt(n) {
        if (n === 0) return "Zero";
        var parts = [], cr = Math.floor(n / 1e7); n %= 1e7;
        var lk = Math.floor(n / 1e5); n %= 1e5;
        var th = Math.floor(n / 1e3); n %= 1e3;
        if (cr) parts.push(wordsInt(cr) + " Crore");
        if (lk) parts.push(below100(lk) + " Lakh");
        if (th) parts.push(below100(th) + " Thousand");
        if (n) parts.push(below1000(n));
        return parts.join(" ");
      }
      function amountWords(amt) {
        var total = Math.round(amt * 100), rs = Math.floor(total / 100), ps = total % 100;
        var s = "Rupees " + wordsInt(rs);
        if (ps) s += " and " + below100(ps) + " Paise";
        return s + " Only";
      }

      /* ---------- calculation ---------- */
      function consigneeOf() {
        return S.same ? { name: S.bName, addr: S.bAddress, state: S.bState, code: S.bStateCode, gstin: S.bGstin }
          : { name: S.cName, addr: S.cAddress, state: S.cState, code: S.cStateCode, gstin: S.cGstin };
      }
      function taxType() {
        if (S.taxMode === "intra") return "intra";
        if (S.taxMode === "inter") return "inter";
        var a = String(S.coStateCode || "").trim(), b = String(consigneeOf().code || S.bStateCode || "").trim();
        return (a && b && a !== b) ? "inter" : "intra";
      }
      function compute() {
        var type = taxType(), rows = [], sum = { total: 0, disc: 0, taxable: 0, cgst: 0, sgst: 0, igst: 0, net: 0 };
        S.items.forEach(function (it) {
          var qty = num(it.qty), rate = num(it.rate), gst = num(it.gst);
          var total = r2(qty * rate), disc = Math.min(Math.max(num(it.disc), 0), total), taxable = r2(total - disc);
          var row = { it: it, qty: qty, rate: rate, total: total, disc: disc, taxable: taxable, gst: gst, cr: 0, ca: 0, sr: 0, sa: 0, ir: 0, ia: 0 };
          if (type === "intra") { row.cr = row.sr = gst / 2; row.ca = r2(taxable * gst / 200); row.sa = r2(taxable * gst / 200) }
          else { row.ir = gst; row.ia = r2(taxable * gst / 100) }
          row.net = r2(taxable + row.ca + row.sa + row.ia);
          sum.net += row.net;
          sum.total += total; sum.disc += disc; sum.taxable += taxable; sum.cgst += row.ca; sum.sgst += row.sa; sum.igst += row.ia;
          rows.push(row);
        });
        Object.keys(sum).forEach(function (k) { sum[k] = r2(sum[k]) });
        var freight = r2(Math.max(num(S.freight), 0));
        var gross = r2(sum.taxable + sum.cgst + sum.sgst + sum.igst);
        var pre = r2(gross + freight), grand = pre, round = 0;
        if (S.roundMode === "auto") { grand = Math.round(pre); round = r2(grand - pre) }
        return { type: type, rows: rows, sum: sum, freight: freight, gross: gross, round: round, grand: grand };
      }

      /* ---------- invoice markup ---------- */
      var LOGO = '<svg viewBox="0 0 170 100" aria-hidden="true"><defs><clipPath id="twc"><rect x="0" y="10" width="200" height="80"/></clipPath></defs>' +
        '<g transform="translate(24,0) skewX(-14)"><rect x="0" y="10" width="62" height="15" fill="#0b2a6b"/><rect x="22" y="25" width="17" height="65" fill="#0b2a6b"/>' +
        '<g clip-path="url(#twc)"><polyline points="58,0 75,92 96,40 117,92 134,0" fill="none" stroke="#1e56d8" stroke-width="15" stroke-linejoin="miter" stroke-miterlimit="10"/></g></g>' +
        '<polygon points="72,0 50,48 62,48 42,100 80,40 66,40 82,0" fill="#f26a1b" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg>';
      function pct(n) { return n ? (Math.round(n * 100) / 100) + "%" : "" }

      function render() {
        var c = compute(), cons = consigneeOf(), landscape = S.orientation === "landscape";
        var h = "";
        h += '<div class="inv-head"><div class="brand">' + LOGO + '<div><div class="name">TECH<b>WAVE</b></div><div class="sub">ENTERPRISES</div><div class="tag">POWERING YOUR INDUSTRY</div></div></div>';
        h += '<div class="contact">' + (S.coAddress ? '<div class="addr">' + esc(S.coAddress) + '</div>' : '') +
          (S.coPhone ? '<div><b>Mobile:</b> ' + esc(S.coPhone) + '</div>' : '') + (S.coEmail ? '<div><b>Email:</b> ' + esc(S.coEmail) + '</div>' : '') +
          (S.coGstin ? '<div><b>GSTIN:</b> ' + '27AAFPY8345R1ZJ' + '</div>' : '') + '</div></div>';
        h += S.docType === "quotation" ? '<div class="inv-title"><span class="hl">Quotation</span></div>' : '<div class="inv-title">Tax Invoice</div>';
        document.title = (S.docType === "quotation" ? "Quotation" : "Tax Invoice") + (S.invNo ? " " + S.invNo.replace(/[\\/:*?"<>|]+/g, "-") : "") + " - Techwave Enterprises";

        h += '<div class="meta">' +
          '<div><b>GSTIN:</b> ' + '27AAFPY8345R1ZJ' + '</div><div><b>Mode of Transport:</b> ' + esc(S.transport) + '</div>' +
          '<div><b>Serial Number Invoice:</b> ' + esc(S.invNo) + '</div><div><b>Vehicle No:</b> ' + esc(S.vehicle) + '</div>' +
          '<div><b>P.O. No. &amp; Date:</b> ' + esc(S.poNo) + (S.poDate ? (S.poNo ? " " : "") + dmy(S.poDate) : "") + '</div>' +
          '<div><b>Date &amp; Time of Supply:</b> ' + esc(dmy(S.supplyDate)) + (S.supplyTime ? " &amp; " + esc(t12(S.supplyTime)) : "") + '</div>' +
          '<div><b>State / Code:</b> ' + esc(S.coState) + ' / ' + esc(S.coStateCode) + '</div><div><b>Place of Supply:</b> ' + esc(S.placeOfSupply) + '</div>' +
          '</div>';

        function party(title, p) {
          return '<div><h4>' + title + '</h4><div class="line"><b>Name:</b> ' + esc(p.name) + '</div><div class="line"><b>Address:</b> ' + esc(p.addr) + '</div>' +
            '<div><b>State:</b> ' + esc(p.state) + ' &nbsp; <b>State Code:</b> ' + esc(p.code) + '</div><div><b>GSTIN/Unique ID:</b> ' + esc(p.gstin) + '</div></div>';
        }
        h += '<div class="parties">' + party("Details of Receiver (Billed To)", { name: S.bName, addr: S.bAddress, state: S.bState, code: S.bStateCode, gstin: S.bGstin }) +
          party("Details of Consignee (Shipped To)", cons) + '</div>';

        h += '<table class="items">' +
          '<thead><tr><th rowspan="2" class="wrap">S. No</th><th rowspan="2" class="wrap" style="min-width:28mm">Description of Goods</th><th rowspan="2" class="wrap">HSN Code</th><th rowspan="2">Qty.</th><th rowspan="2">Unit</th><th rowspan="2">Rate</th><th rowspan="2">Total</th><th rowspan="2">Discount</th><th rowspan="2" class="wrap">Taxable Value</th><th colspan="2">CGST</th><th colspan="2">SGST</th><th colspan="2">IGST</th><th rowspan="2" class="wrap">Total Amount</th></tr>' +
          '<tr><th>Rate</th><th>Amount</th><th>Rate</th><th>Amount</th><th>Rate</th><th>Amount</th></tr></thead><tbody>';
        c.rows.forEach(function (r, i) {
          var intra = c.type === "intra";
          h += '<tr><td class="c">' + (i + 1) + '</td><td class="desc">' + esc(r.it.desc) + '</td><td class="c">' + esc(r.it.hsn) + '</td>' +
            '<td class="c">' + esc(r.qty) + '</td><td class="c">' + esc(r.it.unit) + '</td><td class="n">' + money(r.rate) + '</td><td class="n">' + money(r.total) + '</td>' +
            '<td class="n">' + (r.disc ? money(r.disc) : "") + '</td><td class="n">' + money(r.taxable) + '</td>' +
            '<td class="c">' + (intra ? pct(r.cr) : "") + '</td><td class="n">' + (intra ? money(r.ca) : "") + '</td>' +
            '<td class="c">' + (intra ? pct(r.sr) : "") + '</td><td class="n">' + (intra ? money(r.sa) : "") + '</td>' +
            '<td class="c">' + (!intra ? pct(r.ir) : "") + '</td><td class="n">' + (!intra ? money(r.ia) : "") + '</td>' +
            '<td class="n"><b>' + money(r.net) + '</b></td></tr>';
        });
        var fillMm = Math.max(0, 8 - c.rows.length) * 9;
        if (fillMm) { h += '<tr class="fill" style="height:' + fillMm + 'mm">' + new Array(17).join("<td></td>") + '</tr>' }
        h += '<tr style="font-weight:700;background:#f5f8ff"><td colspan="6" class="n" style="border-top:1px solid #333">Sub-total</td><td class="n" style="border-top:1px solid #333">' + money(c.sum.total) + '</td><td class="n" style="border-top:1px solid #333">' + (c.sum.disc ? money(c.sum.disc) : "") + '</td><td class="n" style="border-top:1px solid #333">' + money(c.sum.taxable) + '</td>' +
          '<td style="border-top:1px solid #333"></td><td class="n" style="border-top:1px solid #333">' + (c.type === "intra" ? money(c.sum.cgst) : "") + '</td><td style="border-top:1px solid #333"></td><td class="n" style="border-top:1px solid #333">' + (c.type === "intra" ? money(c.sum.sgst) : "") + '</td><td style="border-top:1px solid #333"></td><td class="n" style="border-top:1px solid #333">' + (c.type === "inter" ? money(c.sum.igst) : "") + '</td><td class="n" style="border-top:1px solid #333">' + money(c.sum.net) + '</td></tr>';
        h += '</tbody></table>';

        h += '<div class="bottom"><div class="row"><div class="left"><div><b>INVOICE TOTAL (In Words)</b></div><div class="words">' + esc(amountWords(c.grand)) + '</div>' +
          (S.terms ? '<div class="terms">' + esc(S.terms) + '</div>' : '') + (S.bank ? '<div class="bank"><b>Bank details</b>\n' + esc(S.bank) + '</div>' : '') + '</div>' +
          '<div class="sum"><div><span>TOTAL</span><span>' + money(c.gross) + '</span></div><div><span>Freight Charges</span><span>' + (c.freight ? money(c.freight) : "") + '</span></div>' +
          '<div><span>Round Off</span><span>' + (c.round ? (c.round > 0 ? "+" : "−") + money(Math.abs(c.round)) : "") + '</span></div><div><span>INVOICE TOTAL (₹)</span><span>' + money(c.grand) + '</span></div></div></div>' +
          '<div class="sign"><div>Received the goods in good condition.<br><br>Receiver\'s signature</div><div class="r"><div>For <b>Techwave Enterprises</b></div><div>Authorized Signatory</div></div></div></div>';
        h += '<div class="foot">Your Trusted Partner in Industrial Electrical Solutions</div>';

        var sh = $("#sheet");
        sh.innerHTML = h;
        sh.classList.toggle("landscape", landscape);
        $("#pageRule").textContent = "@page{size:A4 " + (landscape ? "landscape" : "portrait") + ";margin:8mm}";
        sh.style.zoom = "";
        fitTable();
        fitPreview();
      }

      /* shrink the table font until every column fits the page width (descriptions wrap, numbers never overflow) */
      function fitTable() {
        var sh = $("#sheet"), t = $("table.items");
        if (!t) return;
        var cs = getComputedStyle(sh), avail = sh.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        var fs = 7.5;
        t.style.fontSize = fs + "pt";
        while (fs > 4.5 && t.offsetWidth > avail + 0.5) { fs -= 0.25; t.style.fontSize = fs + "pt" }
      }

      /* shrink the A4 sheet on narrow screens (screen only; print resets zoom) */
      function fitPreview() {
        var sh = $("#sheet"), wrap = $("#previewWrap");
        sh.style.zoom = "";
        var avail = wrap.clientWidth - 4, need = sh.offsetWidth;
        if (avail > 0 && need > avail) sh.style.zoom = (avail / need).toFixed(3);
      }
      window.addEventListener("resize", fitPreview);
      window.addEventListener("beforeprint", function () { $("#sheet").style.zoom = "1" });
      window.addEventListener("afterprint", fitPreview);

      /* ---------- items form ---------- */
      function renderItems() {
        var box = $("#itemsBox"); box.innerHTML = "";
        S.items.forEach(function (it, i) {
          var d = document.createElement("div"); d.className = "item";
          d.innerHTML = '<div class="item-head"><span>Item ' + (i + 1) + '</span>' + (S.items.length > 1 ? '<button class="btn-small btn-danger" data-del="' + i + '">Remove</button>' : '') + '</div>' +
            '<div style="margin-bottom:8px"><label>Description of goods</label><textarea data-i="' + i + '" data-f="desc" rows="2">' + esc(it.desc) + '</textarea></div>' +
            '<div class="grid3">' +
            '<div><label>HSN Code</label><input data-i="' + i + '" data-f="hsn" value="' + esc(it.hsn) + '"></div>' +
            '<div><label>Qty.</label><input type="number" min="0" step="any" data-i="' + i + '" data-f="qty" value="' + esc(it.qty) + '"></div>' +
            '<div><label>Unit</label><input data-i="' + i + '" data-f="unit" value="' + esc(it.unit) + '"></div>' +
            '<div><label>Rate (₹)</label><input type="number" min="0" step="any" data-i="' + i + '" data-f="rate" value="' + esc(it.rate) + '"></div>' +
            '<div><label>Discount (₹)</label><input type="number" min="0" step="any" data-i="' + i + '" data-f="disc" value="' + esc(it.disc) + '"></div>' +
            '<div><label>GST %</label><input type="number" min="0" step="any" data-i="' + i + '" data-f="gst" value="' + esc(it.gst) + '"></div></div>';
          box.appendChild(d);
        });
      }
      $("#itemsBox").addEventListener("input", function (e) {
        var t = e.target, i = t.getAttribute("data-i"), f = t.getAttribute("data-f");
        if (i === null) return;
        S.items[+i][f] = t.value; persist(); render();
      });
      $("#itemsBox").addEventListener("click", function (e) {
        var i = e.target.getAttribute("data-del");
        if (i === null) return;
        S.items.splice(+i, 1); persist(); renderItems(); render();
      });
      $("#addItem").addEventListener("click", function () {
        var last = S.items[S.items.length - 1] || {};
        var n = blankItem(); n.gst = last.gst != null ? last.gst : 18; n.unit = last.unit || "Nos.";
        S.items.push(n); persist(); renderItems(); render();
      });

      /* ---------- simple fields ---------- */
      function syncForm() {
        $$("[data-k]").forEach(function (el) {
          var k = el.getAttribute("data-k");
          if (el.type === "checkbox") el.checked = !!S[k]; else el.value = S[k] == null ? "" : S[k];
        });
        $("#consigneeFields").style.display = S.same ? "none" : "";
      }
      $$("[data-k]").forEach(function (el) {
        el.addEventListener("input", function () {
          var k = el.getAttribute("data-k");
          S[k] = el.type === "checkbox" ? el.checked : el.value;
          if (k === "same") $("#consigneeFields").style.display = S.same ? "none" : "";
          persist(); render();
        });
        el.addEventListener("change", function () { if (el.type === "checkbox") el.dispatchEvent(new Event("input")) });
      });

      /* ---------- buttons ---------- */
      $("#btnPrint").addEventListener("click", function () {
        // on phones make sure the preview is what gets printed
        window.print();
      });
      $("#btnReset").addEventListener("click", function () {
        if (!confirm("Start a new quotation? Your company details will be kept.")) return;
        var d = defaults();
        COMPANY_KEYS.forEach(function (k) { d[k] = S[k] });
        d.terms = S.terms; d.orientation = S.orientation; d.docType = S.docType;
        S = d; persist(); syncForm(); renderItems(); render();
      });
      function tab(which) {
        document.body.className = "tab-" + which;
        $("#tabEdit").classList.toggle("on", which === "edit");
        $("#tabPrev").classList.toggle("on", which === "preview");
        if (which === "preview") setTimeout(fitPreview, 0);
      }
      $("#tabEdit").addEventListener("click", function () { tab("edit") });
      $("#tabPrev").addEventListener("click", function () { tab("preview") });

      syncForm(); renderItems(); render();
      window.__invoice = { compute: compute, amountWords: amountWords, state: function () { return S } };
    })();
  </script>
</body>
